name: Release asset

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build HACS integration zip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/fully_cloud_emm")
          target = Path("fully_cloud_emm.zip")
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if not path.is_file():
                      continue
                  if "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  archive.write(path, path.relative_to(source))
          PY

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" fully_cloud_emm.zip --clobber

      - name: Show artifact path
        if: github.event_name == 'workflow_dispatch'
        run: |
          ls -lh fully_cloud_emm.zip
