refresh:
  name: Refresh
  description: Fetch the latest Fully Cloud device data for all configured accounts.

refresh_device:
  name: Refresh by Device
  description: Refresh Fully Cloud data for the account that owns the selected devices.
  fields:
    device_id: &device_selector
      name: Fully Cloud EMM devices
      description: Select one or more Fully Cloud EMM devices.
      required: true
      selector:
        device:
          integration: fully_cloud_emm
          multiple: true

load_start_url:
  name: Load start URL
  description: Load the configured Fully Kiosk start URL on selected devices.
  fields:
    device_id: *device_selector
    queue_offline: &queue_offline
      name: Queue for offline devices
      description: Queue the command until offline devices come online.
      default: false
      selector:
        boolean:
    nowait: &nowait
      name: Do not wait for device response
      description: Return immediately after Fully Cloud accepts the command.
      default: true
      selector:
        boolean:

restart_app:
  name: Restart app
  description: Restart the Fully Kiosk app on selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

reboot_device:
  name: Reboot device
  description: Reboot selected devices. Fully requires rooted/provisioned devices for this command.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

screen_on:
  name: Screen on
  description: Turn the screen on for selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

screen_off:
  name: Screen off
  description: Turn the screen off for selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

start_screensaver:
  name: Start screensaver
  description: Start the Fully Kiosk screensaver on selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

stop_screensaver:
  name: Stop screensaver
  description: Stop the Fully Kiosk screensaver on selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

set_overlay_message:
  name: Set overlay message
  description: Show a message overlay on selected devices.
  fields:
    device_id: *device_selector
    text:
      name: Message
      description: Message to show in the overlay.
      required: true
      selector:
        text:
          multiline: true
    queue_offline: *queue_offline
    nowait: *nowait

load_url:
  name: Load URL
  description: Load a URL on selected devices.
  fields:
    device_id: *device_selector
    url:
      name: URL
      description: URL to load.
      required: true
      selector:
        text:
          type: url
    tab:
      name: Tab
      description: Optional existing tab index to load into.
      selector:
        number:
          min: 0
          mode: box
    focus:
      name: Focus tab
      description: Focus the tab after loading the URL.
      selector:
        boolean:
    new_tab:
      name: New tab
      description: Load the URL in a new tab.
      selector:
        boolean:
    queue_offline: *queue_offline
    nowait: *nowait

start_application:
  name: Start application
  description: Start an Android application on selected devices.
  fields:
    device_id: *device_selector
    package:
      name: Package name
      description: Android package name to launch.
      required: true
      selector:
        text:
    action:
      name: Action
      description: Optional Android intent action.
      selector:
        text:
    url:
      name: URL
      description: Optional URL/data value passed to the application.
      selector:
        text:
          type: url
    queue_offline: *queue_offline
    nowait: *nowait

text_to_speech:
  name: Text to speech
  description: Speak text on selected devices.
  fields:
    device_id: *device_selector
    text:
      name: Text
      description: Text to speak.
      required: true
      selector:
        text:
          multiline: true
    locale:
      name: Locale or voice
      description: Optional locale or voice, such as en_US.
      selector:
        text:
    engine:
      name: Engine
      description: Optional text-to-speech engine.
      selector:
        text:
    queue:
      name: Queue speech
      description: Queue this speech after any current speech.
      default: false
      selector:
        boolean:
    queue_offline: *queue_offline
    nowait: *nowait

stop_text_to_speech:
  name: Stop text to speech
  description: Stop text-to-speech playback on selected devices.
  fields:
    device_id: *device_selector
    queue_offline: *queue_offline
    nowait: *nowait

set_audio_volume:
  name: Set audio volume
  description: Set an Android audio stream volume on selected devices.
  fields:
    device_id: *device_selector
    level:
      name: Level
      description: Volume level from 0 to 100.
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    stream:
      name: Audio stream
      description: Android audio stream. Defaults to Music.
      default: 3
      selector:
        select:
          options:
            - label: Voice call
              value: "0"
            - label: System
              value: "1"
            - label: Ring
              value: "2"
            - label: Music
              value: "3"
            - label: Alarm
              value: "4"
            - label: Notification
              value: "5"
            - label: Bluetooth
              value: "6"
            - label: DTMF
              value: "8"
            - label: TTS
              value: "9"
            - label: Accessibility
              value: "10"
    queue_offline: *queue_offline
    nowait: *nowait
